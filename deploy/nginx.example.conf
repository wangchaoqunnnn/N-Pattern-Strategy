# ============================================================================
# N字战法交易系统 - nginx 反向代理示例配置
# 用途: 后端(FastAPI, 监听 127.0.0.1:8000)同时提供页面与 /api; 用 nginx 对外(80/443)
#       统一入口, 避免浏览器直接访问 /api 得到 nginx 404 页。
# 使用(以 root 执行, Debian/Ubuntu nginx 为例):
#   cp deploy/nginx.example.conf /etc/nginx/conf.d/nstrategy.conf
#   nginx -t && systemctl reload nginx
# 若 80 端口被 nginx 自带 default 站点占用且报错, 先停用默认站:
#   rm -f /etc/nginx/sites-enabled/default && systemctl reload nginx
# ============================================================================
server {
    listen 80;
    server_name _;                 # 换成你的域名或服务器IP; _ 表示匹配所有
    client_max_body_size 4m;

    # 统一把全部请求(首页/静态资源 /api/*)反向代理到后端
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }
}
