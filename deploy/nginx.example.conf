# ============================================================================
# N字战法交易系统 - nginx 反向代理示例(多项目共存版)
# 后端(FastAPI)监听 127.0.0.1:8000, 同时提供页面与 /api。
# 与服务器上其它项目共存时, 请按你实际访问方式选择下面一种写法, 不要用 server_name _ 通配!
# ============================================================================

# ---------- 写法A: 该项目有独立域名(推荐) ----------
# 与其它项目各占一个 server 块, nginx 按 Host 域名路由, 互不影响。
# server {
#     listen 80;
#     server_name nstrategy.你的域名.com;   # 把域名解析到本服务器
#     client_max_body_size 4m;
#     location / {
#         proxy_pass http://127.0.0.1:8000;
#         proxy_http_version 1.1;
#         proxy_set_header Host $host;
#         proxy_set_header X-Real-IP $remote_addr;
#         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#         proxy_set_header X-Forwarded-Proto $scheme;
#         proxy_connect_timeout 10s;
#         proxy_read_timeout 300s;   # 全市场扫描/同步等重活耗时较长, 避免504
#         proxy_send_timeout 300s;
#     }
# }

# ---------- 写法B: 本服务器绑定多个IP, 各项目按IP区分 ----------
# 其它项目已经 listen 它们自己的IP:80; 本项目 server 块显式绑定本项目专属IP,
# 只接收发往该IP的请求, 其它项目的IP流量不受影响。
# server {
#     listen 你的项目专用公网IP:80;
#     server_name _;
#     client_max_body_size 4m;
#     location / {
#         proxy_pass http://127.0.0.1:8000;
#         proxy_http_version 1.1;
#         proxy_set_header Host $host;
#         proxy_set_header X-Real-IP $remote_addr;
#         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#         proxy_set_header X-Forwarded-Proto $scheme;
#         proxy_connect_timeout 10s;
#         proxy_read_timeout 300s;
#         proxy_send_timeout 300s;
#     }
# }

# ---------- 写法C: 同一IP、无域名、已有多项目 ----------
# 此时 80 端口无法按IP区分项目 → 不要抢80端口,
# 本项目直接用后端端口访问(安全组放行8000):  http://服务器IP:8000
# 或为该 nginx 增加第二个监听端口(例如 listen 8080; server_name _;), 用 8080 访问本项目。

# 通用检查命令:
#   nginx -t                      # 语法检查(有冲突会直接报错提示)
#   nginx -T | grep server_name   # 查看当前所有站点/域名, 确认没有重名冲突
#   systemctl reload nginx
